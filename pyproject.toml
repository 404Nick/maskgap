[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "maskgap"
version = "0.1.0"
description = "Find the gaps in your CI secret masking: detect and redact encoded leaks of real secret values (base64, hex, URL, JSON, PowerShell, ...)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "404Nick", url = "https://github.com/404Nick" }]
keywords = [
    "security",
    "secrets",
    "ci",
    "logging",
    "redaction",
    "github-actions",
    "base64",
    "masking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Logging",
]
# maskgap deliberately has zero runtime dependencies: it only uses the Python
# standard library. That keeps the tool auditable and free of supply-chain risk.
dependencies = []

[project.urls]
Homepage = "https://github.com/404Nick/maskgap"
Repository = "https://github.com/404Nick/maskgap"
Issues = "https://github.com/404Nick/maskgap/issues"
Changelog = "https://github.com/404Nick/maskgap/blob/main/CHANGELOG.md"
Documentation = "https://github.com/404Nick/maskgap/blob/main/docs/design.md"

[project.scripts]
maskgap = "maskgap.cli:main"

[dependency-groups]
dev = [
    "pip-audit==2.9.0",
    "pytest==9.0.3",
    "ruff==0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/maskgap"]

[tool.hatch.build.targets.sdist]
include = ["src/maskgap", "tests", "docs", "examples", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ARG", "PTH", "RET", "PIE"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
