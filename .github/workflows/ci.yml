name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.14.0
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest==9.0.3
      - run: PYTHONPATH=src pytest tests/ -q

  audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e . pytest==9.0.3 pip-audit==2.9.0
      - run: pip-audit --skip-editable

  dogfood:
    name: dogfood (example log)
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY: S3cret-Example!Value+Specials-DemoOnly-2026-PaddingToWrap12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install .
      - name: scan must fail on platform gaps
        run: |
          status=0
          maskgap scan --env DEPLOY_KEY --only-gaps --no-preview examples/leaky-build.log || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::expected exit 1 from scan, got $status"
            exit 1
          fi
      - name: redaction must remove every known form
        run: |
          maskgap redact --env DEPLOY_KEY examples/leaky-build.log -o clean.log
          for needle in 'S3cret' 'UzNjcmV0' '533363726574' '%2bSpecials'; do
            if grep -qF -- "$needle" clean.log; then
              echo "::error::redacted log still contains $needle"
              exit 1
            fi
          done
      - name: audit must show both covered and uncovered forms
        run: maskgap audit --env DEPLOY_KEY --extended
